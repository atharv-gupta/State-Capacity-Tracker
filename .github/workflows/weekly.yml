name: Tracker run

on:
  schedule:
    - cron: "0 13 * * *"   # daily 13:00 UTC (~7am MT): ingest; Mondays also dedupe
  workflow_dispatch:        # manual trigger from the Actions tab
    inputs:
      dedupe:
        description: "Also run dedupe after ingest"
        type: boolean
        default: false
      digest:
        description: "Also send the weekly email digest"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Ingest past week into Raw Events
        run: python -m tracker.state.pipeline --days 7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      - name: Ingest candidate developments into Candidate Developments
        run: python -m tracker.candidates.pipeline --days 7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      # The congress steps run DAILY, both of them — unlike the state pipeline,
      # whose dedupe is Mondays only. Upcoming hearings are perishable: a
      # Monday-only classify would surface a Wednesday hearing notice after the
      # hearing had already happened.
      - name: Ingest congressional press into Congress Raw
        run: python -m tracker.congress.pipeline --days 7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      - name: Cluster and classify into Congress Events
        run: python -m tracker.congress.dedupe --days 7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      # The federal steps also run DAILY, both of them. Two of the three lanes
      # are perishable: Government Executive and Nextgov hold about seven days
      # of feed, and The Hill about two, so a missed day is a permanent hole.
      - name: Ingest federal executive-branch activity into Federal Raw
        run: python -m tracker.federal.pipeline --days 7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      - name: Cluster and classify into Federal Events
        run: python -m tracker.federal.dedupe --days 7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      # Skips with a clear message (not a failure) if CONGRESS_API_KEY is unset.
      - name: Sync hearings and bills from Congress.gov
        run: python -m tracker.congress.api_sync --days 7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      - name: Check day of week
        id: day
        run: echo "dow=$(date -u +%u)" >> "$GITHUB_OUTPUT"
      - name: Dedupe into Events (Mondays, or manual opt-in)
        if: (github.event_name == 'schedule' && steps.day.outputs.dow == '1') || (github.event_name == 'workflow_dispatch' && inputs.dedupe)
        run: python -m tracker.state.dedupe --days 7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      - name: Dedupe candidate developments into Candidate Events (Mondays, or manual opt-in)
        if: (github.event_name == 'schedule' && steps.day.outputs.dow == '1') || (github.event_name == 'workflow_dispatch' && inputs.dedupe)
        run: python -m tracker.candidates.dedupe --days 7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      # Runs last: the digest reads the clean tables the steps above rebuild,
      # and it now covers both halves (state + governors, federal + congress).
      - name: Send weekly capacity digest (Mondays, or manual opt-in)
        if: (github.event_name == 'schedule' && steps.day.outputs.dow == '1') || (github.event_name == 'workflow_dispatch' && inputs.digest)
        run: python -m tracker.digest --days 7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
